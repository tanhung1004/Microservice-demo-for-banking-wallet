spring.application.name=login-service
server.port=8081

management.endpoints.web.exposure.include=health

# Gia tri mac dinh danh cho moi truong local
spring.datasource.url=${LOGIN_DB_URL:jdbc:postgresql://localhost:15433/login_db}
spring.datasource.username=${LOGIN_DB_USER:login_user}
spring.datasource.password=${LOGIN_DB_PASSWORD:login_dev_password}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.private-key=${JWT_PRIVATE_KEY_PATH:../../secrets/jwt-private.pem}
app.jwt.public-key=${JWT_PUBLIC_KEY_PATH:../../secrets/jwt-public.pem}
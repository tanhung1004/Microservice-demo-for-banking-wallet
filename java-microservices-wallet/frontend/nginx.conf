server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 16k;

    # DNS của Docker, cập nhật khi container backend đổi IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Không tự chuyển sang upstream khác để gửi lại giao dịch.
    proxy_next_upstream off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/auth/ {
        set $login_backend login-service:8081;
        proxy_pass http://$login_backend$request_uri;
    }

    location /api/wallet/ {
        set $wallet_backend wallet-service:8082;
        proxy_pass http://$wallet_backend$request_uri;
    }

    # API không tồn tại không được trả về trang HTML.
    location /api/ {
        default_type application/json;
        return 404 '{"code":"NOT_FOUND","message":"API not found."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}